<main class="container">
    <h1>Welcome to Tauri + Angular!</h1>

    <div class="row">
        <a href="https://tauri.app" target="_blank">
            <img alt="Tauri logo" class="logo tauri" src="/assets/tauri.svg"/>
        </a>
        <a href="https://angular.io" target="_blank">
            <img alt="Angular logo" class="logo angular" src="/assets/angular.svg"/>
        </a>
    </div>
    <p>Click on the logos to learn more about the frameworks</p>

    <form (submit)="greet($event, greetInput.value)" class="row">
        <input #greetInput id="greet-input" placeholder="Enter a name..."/>
        <button type="submit">Greet</button>
    </form>
    <p>{{ greetingMessage }}</p>

    <app-formulaire></app-formulaire>
    <app-table-view></app-table-view>
    <router-outlet/>
</main>
